function push(out,a,b,x,y,nx,ny,d){
 const rax=x-a.pos.x,ray=y-a.pos.y,rbx=x-b.pos.x,rby=y-b.pos.y;
 const vn=(b.vel.x-b.w*rby-a.vel.x+a.w*ray)*nx+(b.vel.y+b.w*rbx-a.vel.y-a.w*rax)*ny;
 const e=vn<-1.5?(a.m.e>.5||b.m.e>.5?Math.max(a.m.e,b.m.e):Math.min(a.m.e,b.m.e)):0;
 out.push({a,b,x,y,nx,ny,d,jn:0,jt:0,bn:-e*vn,mu:Math.sqrt(a.m.f*b.m.f)})}
function inside(p,B){
 const dx=p.x-B.pos.x,dy=p.y-B.pos.y,lx=dx*B.ax.x+dy*B.ax.y,ly=dx*B.ay.x+dy*B.ay.y;
 const px=B.hw-Math.abs(lx),py=B.hh-Math.abs(ly);if(px<=0||py<=0)return null;
 if(px<py){const s=lx<0?-1:1;return[B.ax.x*s,B.ax.y*s,px]}
 const s=ly<0?-1:1;return[B.ay.x*s,B.ay.y*s,py]}
function circBox(c,B,out){
 const dx=c.pos.x-B.pos.x,dy=c.pos.y-B.pos.y,lx=dx*B.ax.x+dy*B.ax.y,ly=dx*B.ay.x+dy*B.ay.y;
 const cx=Math.max(-B.hw,Math.min(B.hw,lx)),cy=Math.max(-B.hh,Math.min(B.hh,ly));
 const ex=lx-cx,ey=ly-cy,d2=ex*ex+ey*ey,r=c.hw;if(d2>r*r)return;
 let nlx,nly,pl,pm,depth;
 if(d2>1e-9){const d=Math.sqrt(d2);nlx=ex/d;nly=ey/d;pl=cx;pm=cy;depth=r-d}
 else{const px=B.hw-Math.abs(lx),py=B.hh-Math.abs(ly);
  if(px<py){const s=lx<0?-1:1;nlx=s;nly=0;pl=s*B.hw;pm=ly;depth=px+r}
  else{const s=ly<0?-1:1;nlx=0;nly=s;pl=lx;pm=s*B.hh;depth=py+r}}
 const nx=B.ax.x*nlx+B.ay.x*nly,ny=B.ax.y*nlx+B.ay.y*nly;
 push(out,c,B,B.pos.x+B.ax.x*pl+B.ay.x*pm,B.pos.y+B.ax.y*pl+B.ay.y*pm,-nx,-ny,depth)}
function collide(a,b,out){
 if(a.shape==='circle'&&b.shape==='circle'){
  const dx=b.pos.x-a.pos.x,dy=b.pos.y-a.pos.y,d=Math.hypot(dx,dy),r=a.hw+b.hw;if(d>=r||d<1e-9)return;
  const nx=dx/d,ny=dy/d;push(out,a,b,a.pos.x+nx*(a.hw-(r-d)/2),a.pos.y+ny*(a.hw-(r-d)/2),nx,ny,r-d)}
 else if(a.shape==='circle')circBox(a,b,out);
 else if(b.shape==='circle')circBox(b,a,out);
 else{for(const v of a.vs){const r=inside(v,b);if(r)push(out,a,b,v.x,v.y,-r[0],-r[1],r[2])}
  for(const v of b.vs){const r=inside(v,a);if(r)push(out,a,b,v.x,v.y,r[0],r[1],r[2])}}}
function apply(a,b,rax,ray,rbx,rby,px,py){
 a.vel.x-=px*a.im;a.vel.y-=py*a.im;a.w-=a.ii*(rax*py-ray*px);
 b.vel.x+=px*b.im;b.vel.y+=py*b.im;b.w+=b.ii*(rbx*py-rby*px)}
function solve(c){
 const{a,b,nx,ny}=c,rax=c.x-a.pos.x,ray=c.y-a.pos.y,rbx=c.x-b.pos.x,rby=c.y-b.pos.y;
 const rv=()=>[b.vel.x-b.w*rby-a.vel.x+a.w*ray,b.vel.y+b.w*rbx-a.vel.y-a.w*rax];
 let[vx,vy]=rv();const vn=vx*nx+vy*ny,r1=rax*ny-ray*nx,r2=rbx*ny-rby*nx;
 const k=a.im+b.im+r1*r1*a.ii+r2*r2*b.ii;if(!k)return;
 let j=(c.bn-vn)/k;const o=c.jn;c.jn=Math.max(0,o+j);j=c.jn-o;
 apply(a,b,rax,ray,rbx,rby,nx*j,ny*j);
 [vx,vy]=rv();const tx=-ny,ty=nx,t1=rax*ty-ray*tx,t2=rbx*ty-rby*tx;
 const kt=a.im+b.im+t1*t1*a.ii+t2*t2*b.ii,mx=c.mu*c.jn,ot=c.jt;
 c.jt=Math.max(-mx,Math.min(mx,ot+(-(vx*tx+vy*ty)/kt)));const jt=c.jt-ot;
 apply(a,b,rax,ray,rbx,rby,tx*jt,ty*jt)}

class SistemaParticulas{
 constructor(){this.p=[]}
 emit(x,y,cols,n,sp=5){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());
  this.p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:.7+Math.random()*.6,t:0,s:.08+Math.random()*.14,r:Math.random()*6,c:cols[i%cols.length]})}}
 update(dt){for(const q of this.p){q.t+=dt;q.vy+=G*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.r+=dt*8}
  this.p=this.p.filter(q=>q.t<q.life)}
 draw(c){for(const q of this.p){c.save();c.globalAlpha=Math.max(0,1-q.t/q.life);c.translate(q.x,q.y);if(q.ln){c.rotate(q.ag);c.fillStyle=q.c;c.fillRect(-q.ln,-q.s*.35,q.ln,q.s*.7)}else{c.rotate(q.r);c.fillStyle=q.c;c.fillRect(-q.s,-q.s,q.s*2,q.s*2)}c.restore()}}}

class Resortera{
 constructor(x,y){this.anchor=new Vector2D(x,y);this.pull=new Vector2D(x,y);this.max=2.6;this.k=9}
 setPull(wx,wy){let dx=wx-this.anchor.x,dy=wy-this.anchor.y;const l=Math.hypot(dx,dy);
  if(l>this.max){dx*=this.max/l;dy*=this.max/l}
  dy=Math.min(dy,15.3-this.anchor.y);this.pull.x=this.anchor.x+dx;this.pull.y=this.anchor.y+dy}
 reset(){this.pull.set(this.anchor)}
 get power(){const v=Vector2D.sub(this.anchor,this.pull);return v.scale(this.k)}
 band(c,tx,ty,col){c.strokeStyle=col;c.lineWidth=.17;c.lineCap='round';c.beginPath();c.moveTo(tx,ty);c.lineTo(this.pull.x,this.pull.y);c.stroke()}
 drawBack(c){const a=this.anchor;c.strokeStyle='#4d2f16';c.lineWidth=.3;c.lineCap='round';
  c.beginPath();c.moveTo(a.x,GY);c.lineTo(a.x,a.y+1.3);c.lineTo(a.x+.32,a.y);c.stroke();this.band(c,a.x+.32,a.y,'#2e1b0c')}
 drawFront(c){const a=this.anchor;c.strokeStyle='#6b4423';c.lineWidth=.34;c.lineCap='round';
  c.beginPath();c.moveTo(a.x,a.y+1.3);c.lineTo(a.x-.3,a.y);c.stroke();this.band(c,a.x-.3,a.y,'#3d2610')}
 drawTraj(c){const p=this.pull,v=this.power;c.fillStyle='#fff';
  for(let t=.06,i=0;t<(this.max>3?4.5:3.2);t+=.07,i++){const x=p.x+v.x*t,y=p.y+v.y*t+.5*G*t*t;if(y>GY||x>(this.max>3?40:34))break;
   c.globalAlpha=Math.max(.15,.85-i*.018);c.beginPath();c.arc(x,y,.075,0,7);c.fill()}c.globalAlpha=1}}
